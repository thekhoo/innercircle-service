AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deployment role for GitHub Actions to build/push Docker images to ECR and
  deploy the ECR repository and Lambda/API Gateway service stacks.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - production
      - development
      - shared
    Description: Deployment environment partition
  ServiceName:
    Type: String
    Description: >-
      Service name used in resource ARN scoping (e.g. innercircle-service).
      Must match the prefix used for all deployed resources.
  Repository:
    Type: String
    Description: GitHub repository slug used as a tag (e.g. innercircle/innercircle-service)
  EntryRoleArn:
    Type: String
    Default: arn:aws:iam::020844256789:role/github-actions-oidc-entry-role
    Description: ARN of the role allowed to assume the created deployment role

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-actions-${Environment}-${ServiceName}-deployment-role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref EntryRoleArn
            Action: sts:AssumeRole
      Tags:
        - Key: application
          Value: innercircle
        - Key: environment
          Value: !Ref Environment
        - Key: service-name
          Value: !Ref ServiceName
        - Key: repository
          Value: !Ref Repository
        - Key: managed-by
          Value: cloudformation
        - Key: cloudformation-stack-name
          Value: !Ref AWS::StackName
      Policies:
        - PolicyName: !Sub github-actions-${Environment}-${ServiceName}-deployment-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStackManagement
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:SetStackPolicy
                  - cloudformation:UpdateTerminationProtection
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/${Environment}-${ServiceName}-*/*

              - Sid: CloudFormationGlobalRead
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: '*'

              - Sid: S3CodePipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::aws-management-codepipeline/${Environment}/*

              - Sid: S3CodePipelineBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - arn:aws:s3:::aws-management-codepipeline
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub ${Environment}/*
                      - !Sub ${Environment}

              - Sid: S3SamBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-*/*

              - Sid: EcrControlPlane
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:ListTagsForResource
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:PutLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:DeleteRepositoryPolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:DescribeImageScanFindings
                Resource:
                  - !Sub arn:aws:ecr:*:${AWS::AccountId}:repository/${ServiceName}

              - Sid: EcrDataPlane
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:BatchDeleteImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub arn:aws:ecr:*:${AWS::AccountId}:repository/${ServiceName}

              - Sid: EcrAuthToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

              - Sid: LambdaManagement
                Effect: Allow
                Action:
                  - lambda:*
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:${Environment}-${ServiceName}-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:${Environment}-${ServiceName}-*:*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:${Environment}-${ServiceName}-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:${Environment}-${ServiceName}-*:*

              - Sid: LambdaGlobalRead
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:ListLayers
                  - lambda:GetAccountSettings
                Resource: '*'

              - Sid: ApiGatewayManagement
                Effect: Allow
                Action:
                  - apigateway:*
                Resource:
                  - arn:aws:apigateway:*::/restapis
                  - arn:aws:apigateway:*::/restapis/*
                  - arn:aws:apigateway:*::/apis
                  - arn:aws:apigateway:*::/apis/*
                  - arn:aws:apigateway:*::/tags/*

              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:*
                Resource:
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Environment}-${ServiceName}-*
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Environment}-${ServiceName}-*:*
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/${Environment}/${ServiceName}/*
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/${Environment}/${ServiceName}/*:*

              - Sid: CloudWatchLogsGlobalRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: '*'

              - Sid: SsmParameterStore
                Effect: Allow
                Action:
                  - ssm:*
                Resource:
                  - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/${Environment}/${ServiceName}/*

              - Sid: KmsViaService
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !Sub arn:aws:kms:*:${AWS::AccountId}:key/*
                Condition:
                  StringLike:
                    kms:ViaService:
                      - ssm.*.amazonaws.com
                      - ecr.*.amazonaws.com

              - Sid: IamRoleAndPolicyManagement
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:ListRoles
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:ListPolicies
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:SetDefaultPolicyVersion
                  - iam:ListEntitiesForPolicy
                  - iam:TagPolicy
                  - iam:UntagPolicy
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                  - iam:GetServiceLinkedRoleDeletionStatus
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                Resource: '*'

              - Sid: IamPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${Environment}-${ServiceName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - apigateway.amazonaws.com
                      - cloudformation.amazonaws.com

Outputs:
  RoleArn:
    Description: ARN of the deployment role
    Value: !GetAtt DeploymentRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn
  RoleName:
    Description: Name of the deployment role
    Value: !Ref DeploymentRole
    Export:
      Name: !Sub ${AWS::StackName}-RoleName
